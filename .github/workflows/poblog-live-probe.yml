name: Poblog live probe

on:
  pull_request:
    branches:
      - main
    paths:
      - "crawlers/poblog_crawler.py"
      - ".github/workflows/poblog-live-probe.yml"

concurrency:
  group: poblog-live-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install crawler dependencies
        run: python -m pip install -r requirements.txt
      - name: Probe public Poblog catalogue
        run: python crawlers/poblog_crawler.py --dry-run
