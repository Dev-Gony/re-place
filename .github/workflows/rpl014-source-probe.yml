name: RPL-014 source shape probe

on:
  push:
    branches:
      - fix/rpl-014-ux-data-normalization
    paths:
      - ".github/workflows/rpl014-source-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Inspect current Mible cards
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup

          html=requests.get("https://www.mrblog.net/",headers={"User-Agent":"Mozilla/5.0"},timeout=(8,20)).text
          soup=BeautifulSoup(html,"html.parser")
          seen=set()
          count=0
          for a in soup.find_all("a",href=True):
              href=a.get("href","")
              m=re.fullmatch(r"/campaigns/(\d+)",href)
              if not m or m.group(1) in seen:
                  continue
              seen.add(m.group(1))
              print("=== CARD",m.group(1),"===")
              print("TEXT"," | ".join(a.stripped_strings)[:1800])
              for child in a.find_all(recursive=False):
                  print("CHILD",child.name,child.get("class"),"|"," | ".join(child.stripped_strings)[:1000])
              print("HTML",str(a)[:7000])
              count+=1
              if count>=8:
                  break
          print("TOTAL_SAMPLE",count)
          PY
