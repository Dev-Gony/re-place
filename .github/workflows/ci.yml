name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: node --test test/*.test.cjs
      - run: npm run test:dom
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEON_AUTH_BASE_URL: "https://example.invalid/neondb/auth"
          NEON_AUTH_COOKIE_SECRET: "ci-only-cookie-secret-32-characters-minimum"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s test -p "test_*.py" -v
      - run: python -m compileall -q crawlers test
