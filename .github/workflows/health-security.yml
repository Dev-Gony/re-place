name: Health security regression

on:
  pull_request:
    paths:
      - "app/api/health/**"
      - "test/health-route.test.cjs"
      - ".github/workflows/health-security.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test test/health-route.test.cjs
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
