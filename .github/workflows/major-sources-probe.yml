name: Major sources public probe

on:
  push:
    branches:
      - feat/rpl-011-revu-supermembers
    paths:
      - ".github/workflows/major-sources-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Inspect Supermembers API call sites
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          headers = {"User-Agent": "Mozilla/5.0"}
          page = "https://www.supermembers.co.kr/"
          html = requests.get(page, headers=headers, timeout=(8, 20)).text
          soup = BeautifulSoup(html, "html.parser")
          scripts = [
              urljoin(page, tag["src"])
              for tag in soup.find_all("script", src=True)
              if tag.get("src")
          ]

          js = "\n".join(
              requests.get(src, headers=headers, timeout=(8, 20)).text
              for src in scripts
          )

          needles = [
              "api.supermembers.co.kr",
              "console-api.supermembers.co.kr",
              "/company",
              "/ad",
              "/store",
              "/place",
              "/experience",
              "/member",
              "/blogger",
              "/reviewer",
          ]

          for needle in needles:
              print(f"=== needle {needle} ===")
              starts = [m.start() for m in re.finditer(re.escape(needle), js, re.I)]
              print("matches:", len(starts))
              for pos in starts[:30]:
                  snippet = js[max(0, pos-350):pos+700]
                  snippet = " ".join(snippet.split())
                  print("snippet:", snippet[:1300])

          call_pattern = re.compile(
              r"(?:\.get|\.post|\.put|\.delete)\((.{0,260})\)",
              re.I,
          )
          calls = []
          for match in call_pattern.finditer(js):
              value = " ".join(match.group(0).split())
              if any(k in value.lower() for k in (
                  "company", "store", "place", "ad", "experience",
                  "member", "blogger", "review"
              )):
                  if value not in calls:
                      calls.append(value)

          print("=== api_calls ===")
          print("count:", len(calls))
          for call in calls[:120]:
              print("call:", call[:1000])
          PY
