name: Major sources public probe

on:
  push:
    branches:
      - feat/rpl-011-revu-supermembers
    paths:
      - ".github/workflows/major-sources-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Inspect public JS endpoints
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154.0.0.0 Safari/537.36",
              "Accept-Language": "ko-KR,ko;q=0.9,en;q=0.7",
          }

          targets = {
              "revu": "https://webview.revu.net/",
              "supermembers": "https://www.supermembers.co.kr/",
          }

          for name, page_url in targets.items():
              print(f"=== {name} ===")
              html = requests.get(page_url, headers=headers, timeout=(8, 20)).text
              soup = BeautifulSoup(html, "html.parser")
              scripts = [
                  urljoin(page_url, tag["src"])
                  for tag in soup.find_all("script", src=True)
                  if tag.get("src")
              ]

              print("script_count:", len(scripts))
              for src in scripts[:12]:
                  try:
                      js = requests.get(src, headers=headers, timeout=(8, 20)).text
                  except Exception as exc:
                      print("script_error:", src, type(exc).__name__)
                      continue

                  print("script:", src, "bytes:", len(js))
                  candidates = []
                  patterns = (
                      r"https://(?:api\.weble\.net|api\.supermembers\.co\.kr|console-api\.supermembers\.co\.kr)[^\"'\s)]+",
                      r"[\"'](/(?:v\d+/)?(?:campaigns?|stores?|places?|shops?|benefits?|experiences?|members?|search|regions?)[^\"']*)[\"']",
                      r"[\"']([^\"']*(?:campaign|store|place|shop|benefit|experience)[^\"']{0,120})[\"']",
                  )
                  for pattern in patterns:
                      for match in re.finditer(pattern, js, re.I):
                          value = match.group(1) if match.lastindex else match.group(0)
                          value = value[:400]
                          if value not in candidates:
                              candidates.append(value)

                  for item in candidates[:160]:
                      print("candidate:", item)
          PY
