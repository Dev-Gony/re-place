name: Major sources public probe

on:
  push:
    branches:
      - feat/rpl-011-revu-supermembers
    paths:
      - ".github/workflows/major-sources-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Probe exposed read-only Supermembers GET routes
        run: |
          python - <<'PY'
          import json
          import requests

          headers = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json,text/plain,*/*",
              "Origin": "https://www.supermembers.co.kr",
              "Referer": "https://www.supermembers.co.kr/",
          }

          candidates = [
              "https://api.supermembers.co.kr/company3/v2?orderBy=id&direction=desc",
              "https://api.supermembers.co.kr/company3/v2?orderBy=id&direction=desc&limit=10",
              "https://api.supermembers.co.kr/company/option",
              "https://api.supermembers.co.kr/company3",
              "https://api.supermembers.co.kr/company3?limit=10",
              "https://api.supermembers.co.kr/ads",
              "https://api.supermembers.co.kr/ad",
          ]

          for url in candidates:
              print("\n===", url, "===")
              try:
                  response = requests.get(
                      url,
                      headers=headers,
                      timeout=(8, 20),
                      allow_redirects=False,
                  )
              except Exception as exc:
                  print("error:", type(exc).__name__, str(exc)[:300])
                  continue

              print("status:", response.status_code)
              print("content_type:", response.headers.get("content-type"))
              print("www_authenticate:", response.headers.get("www-authenticate"))
              print("bytes:", len(response.content))
              body = response.text[:1800]
              print("body:", " ".join(body.split()))

              if response.ok and "json" in (response.headers.get("content-type") or ""):
                  try:
                      data = response.json()
                      if isinstance(data, dict):
                          print("json_keys:", sorted(data.keys()))
                      elif isinstance(data, list):
                          print("json_list_len:", len(data))
                          if data:
                              first = data[0]
                              if isinstance(first, dict):
                                  print("first_keys:", sorted(first.keys()))
                  except Exception:
                      pass
          PY
