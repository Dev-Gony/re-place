name: Gangnam live smoke

on:
  push:
    branches:
      - feat/rpl-011-major-sources
    paths:
      - ".github/workflows/gangnam-live-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Discover Gangnam public navigation routes
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse

          seed = "https://gangnam-review.net/cp/?id=2295177"
          response = requests.get(
              seed,
              timeout=(8, 20),
              headers={"User-Agent": "Mozilla/5.0"},
          )
          response.raise_for_status()
          soup = BeautifulSoup(response.text, "html.parser")

          routes = {}
          for anchor in soup.find_all("a", href=True):
              href = urljoin(response.url, anchor["href"])
              parsed = urlparse(href)
              if parsed.netloc != "gangnam-review.net":
                  continue
              label = " ".join(anchor.get_text(" ", strip=True).split())
              key = parsed.path + (("?" + parsed.query) if parsed.query else "")
              if key not in routes:
                  routes[key] = label

          print("routes:", len(routes))
          for route, label in sorted(routes.items()):
              print("route:", route, "|", label[:100])
          PY
