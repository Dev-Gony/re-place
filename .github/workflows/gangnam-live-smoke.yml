name: Gangnam live smoke

on:
  push:
    branches:
      - feat/rpl-011-major-sources
    paths:
      - ".github/workflows/gangnam-live-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Inspect Gangnam campaign-list inline JavaScript
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup

          url = "https://gangnam-review.net/cp/?id=2295177"
          response = requests.get(
              url,
              timeout=(8, 20),
              headers={"User-Agent": "Mozilla/5.0"},
          )
          response.raise_for_status()
          soup = BeautifulSoup(response.text, "html.parser")

          blocks = [
              script.get_text("\n", strip=False)
              for script in soup.find_all("script")
              if not script.get("src")
          ]

          needles = (
              "b_html +=",
              "$.ajax",
              "ajax_req",
              "list_item",
              "recommend",
              "relation",
              "campaign",
          )

          matches = []
          for block in blocks:
              if not any(needle.lower() in block.lower() for needle in needles):
                  continue
              lines = block.splitlines()
              for index, line in enumerate(lines):
                  if any(needle.lower() in line.lower() for needle in needles):
                      start = max(0, index - 8)
                      end = min(len(lines), index + 18)
                      snippet = "\n".join(lines[start:end]).strip()
                      if snippet and snippet not in matches:
                          matches.append(snippet)

          print("candidate_blocks:", len(matches))
          for i, snippet in enumerate(matches[:30], 1):
              print(f"--- candidate {i} ---")
              print(snippet[:5000])
          PY
