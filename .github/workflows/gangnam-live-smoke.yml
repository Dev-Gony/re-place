name: Gangnam live smoke

on:
  push:
    branches:
      - feat/rpl-011-major-sources
    paths:
      - "crawlers/gangnam_crawler.py"
      - ".github/workflows/gangnam-live-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Probe current Gangnam detail page
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse

          url = "https://gangnam-review.net/cp/?id=2295177"
          response = requests.get(
              url,
              timeout=(8, 20),
              headers={"User-Agent": "Mozilla/5.0"},
          )
          print("status:", response.status_code)
          print("final_url:", response.url)
          print("bytes:", len(response.content))
          response.raise_for_status()

          soup = BeautifulSoup(response.text, "html.parser")
          hrefs = []
          for anchor in soup.find_all("a", href=True):
              absolute = urljoin(response.url, anchor["href"])
              if urlparse(absolute).netloc == "gangnam-review.net":
                  hrefs.append(absolute)

          campaign_links = sorted({
              href for href in hrefs
              if re.search(r"/cp/\?id=\d+", href)
          })
          print("campaign_links:", len(campaign_links))
          for href in campaign_links[:30]:
              print("campaign:", href)

          script_srcs = sorted({
              urljoin(response.url, script["src"])
              for script in soup.find_all("script", src=True)
          })
          print("script_srcs:", len(script_srcs))
          for src in script_srcs[:30]:
              print("script:", src)

          form_actions = sorted({
              urljoin(response.url, form.get("action", ""))
              for form in soup.find_all("form")
              if form.get("action")
          })
          print("form_actions:", len(form_actions))
          for action in form_actions[:30]:
              print("form:", action)
          PY
