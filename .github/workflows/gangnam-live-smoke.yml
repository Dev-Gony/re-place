name: Gangnam live smoke

on:
  push:
    branches:
      - feat/rpl-011-major-sources
    paths:
      - ".github/workflows/gangnam-live-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Probe Gangnam public recommendation endpoint
        run: |
          python - <<'PY'
          import json
          import requests

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0",
              "Referer": "https://gangnam-review.net/cp/?id=2295177",
          })

          url = "https://gangnam-review.net/index_recommend.php"
          response = session.get(url, timeout=(8, 20))
          print("status:", response.status_code)
          print("content_type:", response.headers.get("content-type"))
          print("bytes:", len(response.content))
          response.raise_for_status()

          data = response.json()
          print("top_keys:", sorted(data.keys()) if isinstance(data, dict) else type(data).__name__)
          items = data.get("items", []) if isinstance(data, dict) else []
          print("items:", len(items))
          if items:
              print("item_keys:", sorted(items[0].keys()))
              for item in items[:10]:
                  safe = {
                      key: item.get(key)
                      for key in (
                          "href", "title", "subject", "type", "d_gap",
                          "apply", "apply_cnt", "recruit", "recruit_cnt",
                          "benefit", "reward", "location", "region"
                      )
                      if key in item
                  }
                  print("item:", json.dumps(safe, ensure_ascii=False)[:1200])
          PY
