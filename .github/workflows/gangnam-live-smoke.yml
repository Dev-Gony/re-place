name: Gangnam live smoke

on:
  push:
    branches:
      - feat/rpl-011-major-sources
    paths:
      - ".github/workflows/gangnam-live-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Inspect Gangnam recommendation JSON contract
        run: |
          python - <<'PY'
          import json
          import requests

          url = "https://gangnam-review.net/index_recommend.php"
          headers = {
              "User-Agent": "Mozilla/5.0",
              "Referer": "https://gangnam-review.net/cp/?id=2295177",
          }

          response = requests.get(url, headers=headers, timeout=(8, 20))
          response.raise_for_status()
          data = response.json()

          print("count:", data.get("count"))
          print("qr:", json.dumps(data.get("qr"), ensure_ascii=False)[:2000])
          items = data.get("items", [])
          print("items:", len(items))
          for index, item in enumerate(items[:3], 1):
              print(
                  f"full_item_{index}:",
                  json.dumps(item, ensure_ascii=False)[:5000],
              )

          seen = set()
          for attempt in range(5):
              sample = requests.get(
                  url,
                  headers=headers,
                  timeout=(8, 20),
              ).json().get("items", [])
              seen.update(
                  item.get("href")
                  for item in sample
                  if item.get("href")
              )
              print(f"sample_{attempt + 1}_items:", len(sample))
              print(f"sample_{attempt + 1}_union:", len(seen))
          PY
