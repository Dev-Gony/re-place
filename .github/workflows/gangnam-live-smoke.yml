name: Gangnam live smoke

on:
  push:
    branches:
      - feat/rpl-011-major-sources
    paths:
      - "crawlers/gangnam_crawler.py"
      - ".github/workflows/gangnam-live-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Probe current Gangnam detail internals
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse

          url = "https://gangnam-review.net/cp/?id=2295177"
          response = requests.get(
              url,
              timeout=(8, 20),
              headers={"User-Agent": "Mozilla/5.0"},
          )
          print("status:", response.status_code)
          print("final_url:", response.url)
          print("bytes:", len(response.content))
          response.raise_for_status()

          soup = BeautifulSoup(response.text, "html.parser")

          hrefs = []
          for anchor in soup.find_all("a", href=True):
              absolute = urljoin(response.url, anchor["href"])
              if urlparse(absolute).netloc == "gangnam-review.net":
                  hrefs.append(absolute)

          interesting_links = sorted({
              href for href in hrefs
              if any(token in href.lower() for token in (
                  "/cp/", "campaign", "list", "page=", "category", "search"
              ))
          })
          print("interesting_links:", len(interesting_links))
          for href in interesting_links[:80]:
              print("link:", href)

          inline = "\n".join(
              script.get_text("\n", strip=True)
              for script in soup.find_all("script")
              if not script.get("src")
          )
          patterns = (
              r"[^\n;]{0,120}\$\.ajax[^\n;]{0,220}",
              r"[^\n;]{0,120}\$\.get[^\n;]{0,220}",
              r"[^\n;]{0,120}\$\.post[^\n;]{0,220}",
              r"[^\n;]{0,120}(?:ajax|api|campaign|list|load|page)[^\n;]{0,220}",
          )
          snippets = []
          for pattern in patterns:
              for match in re.finditer(pattern, inline, re.I):
                  snippet = " ".join(match.group(0).split())
                  if snippet not in snippets:
                      snippets.append(snippet)

          print("inline_candidates:", len(snippets))
          for snippet in snippets[:80]:
              print("inline:", snippet[:340])
          PY
