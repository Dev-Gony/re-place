name: Assaview live probe

on:
  pull_request:
    branches:
      - main
    paths:
      - "crawlers/assaview_crawler.py"
      - "requirements.txt"
      - ".github/workflows/assaview-live-probe.yml"

permissions:
  contents: read

concurrency:
  group: assaview-live-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install crawler dependencies
        run: python -m pip install -r requirements.txt
      - name: Probe public Assaview catalogue without database writes
        run: python crawlers/assaview_crawler.py --dry-run
