name: RPL-017 dependency sync

on:
  push:
    branches:
      - release/rpl-017-launch-polish
    paths:
      - ".github/workflows/rpl017-deps.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rpl-017-launch-polish
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install @vercel/analytics @vercel/speed-insights --save
      - name: Commit dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "deps: add Vercel launch telemetry"
          git push origin HEAD:release/rpl-017-launch-polish
