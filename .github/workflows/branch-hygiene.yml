name: Branch hygiene

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged head branches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keep = new Set([
              "main",
              "chore/rpl-024-production-auth-smoke",
              "feat/rpl-026-mobile-app-shell",
            ]);

            async function deleteBranch(branch) {
              if (!branch || keep.has(branch)) return false;
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`,
                });
                core.info(`Deleted merged branch: ${branch}`);
                return true;
              } catch (error) {
                if (error.status === 422 || error.status === 404) {
                  core.info(`Skipped branch ${branch}: ${error.message}`);
                  return false;
                }
                throw error;
              }
            }

            if (context.eventName === "pull_request") {
              const pr = context.payload.pull_request;
              if (
                pr.merged &&
                pr.base.ref === "main" &&
                pr.head.repo?.full_name === `${owner}/${repo}`
              ) {
                await deleteBranch(pr.head.ref);
              }
              return;
            }

            const pulls = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: "closed",
                base: "main",
                per_page: 100,
                sort: "updated",
                direction: "desc",
              },
            );

            const currentBranches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 },
            );
            const existing = new Set(currentBranches.map((item) => item.name));

            const mergedHeads = new Set(
              pulls
                .filter(
                  (pr) =>
                    pr.merged_at &&
                    pr.head.repo?.full_name === `${owner}/${repo}`,
                )
                .map((pr) => pr.head.ref),
            );

            let deleted = 0;
            for (const branch of mergedHeads) {
              if (!existing.has(branch) || keep.has(branch)) continue;
              if (await deleteBranch(branch)) deleted += 1;
            }

            core.summary
              .addHeading("Branch hygiene")
              .addRaw(`Deleted ${deleted} merged branch(es).\n`)
              .addRaw(`Preserved: ${[...keep].join(", ")}\n`)
              .write();
