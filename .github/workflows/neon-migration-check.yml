name: Production database smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify production database
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python -m pip install "psycopg[binary]>=3.2,<4"
          python - <<'PY'
          import os
          import psycopg

          database_url = os.environ.get("DATABASE_URL")
          if not database_url:
              raise SystemExit("PRODUCTION_DATABASE_URL secret is missing")

          with psycopg.connect(database_url) as conn:
              with conn.cursor() as cur:
                  cur.execute("select 1")
                  value = cur.fetchone()[0]

          if value != 1:
              raise SystemExit("Production database smoke check failed")

          print("Production database connection OK")
          PY
