name: Collect campaigns

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "crawlers/**"
      - "requirements.txt"
      - ".github/workflows/collect-campaigns.yml"
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: re-place-campaign-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install crawler dependencies
        run: python -m pip install -r requirements.txt

      - name: Run active collectors
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python crawlers/run_all.py
